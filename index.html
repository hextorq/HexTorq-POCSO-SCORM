<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suraksha Kavasam — POCSO Awareness Module</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="ambientLayer" aria-hidden="true"></div>

<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-brand">
      <span class="badge-icon" id="brandIcon"></span>
      <div>
        <div class="brand-title">Suraksha Kavasam</div>
        <div class="brand-sub">Tamil Nadu Police &middot; POCSO Awareness</div>
      </div>
    </div>
    <div class="topbar-progress">
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressLabel" class="progress-label">0%</div>
    </div>
    <button id="fullscreenBtn" class="icon-btn" title="Enter full-screen mode" aria-label="Toggle full-screen mode"></button>
    <div id="scrollProgress" class="scroll-progress"></div>
  </header>

  <div class="layout">
    <!-- Chapter sidebar -->
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-title">Chapters</div>
      <ol id="chapterList" class="chapter-list"></ol>
    </nav>

    <!-- Main stage -->
    <main id="stage" class="stage">
      <!-- screens injected here by app.js -->
    </main>
  </div>

  <footer class="footer">
    <button id="btnBack" class="btn btn-ghost" disabled>&larr; Back</button>
    <div id="footerMsg" class="footer-msg"></div>
    <button id="btnNext" class="btn btn-primary">Start &rarr;</button>
  </footer>

</div>

<button id="scrollCue" class="scroll-cue" aria-label="Scroll down for more"></button>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/Draggable.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/confetti.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/sfx.js"></script>
<script src="js/speech.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
