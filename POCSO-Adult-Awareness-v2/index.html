<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCSO Awareness (Age: 18+)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="loading-inner">
    <img src="img/singappen-logo.png" alt="Singapenn" class="loading-logo">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading POCSO Awareness…</div>
  </div>
</div>

<div id="app">

  <header class="topbar">
    <div class="topbar-brand-row">
      <img src="img/singappen-logo.png" alt="Singappen" class="brand-logo brand-logo-left">
      <div class="brand-center">
        <div class="brand-line brand-line-1">Singapenn Special Task Force Initiative</div>
        <div class="brand-line brand-line-2">Tamil Nadu Police</div>
      </div>
      <img src="img/tamilnadu-police-logo.png" alt="Tamil Nadu Police" class="brand-logo brand-logo-right">
    </div>
    <div class="topbar-progress-row">
      <div class="progress-center-block">
        <div class="module-name">POCSO Awareness (Age: 18+)</div>
        <div class="topbar-progress">
          <div id="progressChapterLabel" class="progress-chapter-label">Chapter 1</div>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <div id="progressLabel" class="progress-label">0%</div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="sidebar" class="sidebar">
      <div class="sidebar-title">Chapters</div>
      <ol id="chapterList" class="chapter-list"></ol>
    </nav>

    <main id="stage" class="stage">
      <!-- pages injected here by app.js -->
    </main>
  </div>

  <footer class="footer">
    <button id="btnBack" class="btn btn-ghost" disabled>&larr; Back</button>
    <div id="footerMsg" class="footer-msg"></div>
    <button id="btnNext" class="btn btn-primary">Start &rarr;</button>
  </footer>

</div>

<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/vendor/Draggable.min.js"></script>
<script src="js/vendor/confetti.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/sfx.js"></script>
<script src="js/speech.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
</body>
</html>
